<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad2)"/>
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#grad1)" stroke-width="8"/>
  
  <!-- V Letter -->
  <path d="M140 160 L200 340 L256 180 L312 340 L372 160" 
        fill="none" 
        stroke="url(#grad1)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- C Letter - stylized -->
  <path d="M380 200 
           C380 140 340 100 280 100 
           C220 100 180 140 180 200 
           C180 260 220 300 280 300 
           C340 300 380 260 380 200" 
        fill="none" 
        stroke="#f8fafc" 
        stroke-width="22" 
        stroke-linecap="round"/>
  
  <!-- Small accent dot -->
  <circle cx="256" cy="400" r="12" fill="url(#grad1)"/>
</svg>
